[project]
name = "warmintro"
version = "0.1.0"
description = "Personalized conversation starters from professional profiles: a LlamaIndex RAG app running locally on IBM Granite (Ollama) or deployed with Gemini."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.14.25",
    "llama-index-llms-ollama>=0.11",
    "llama-index-embeddings-ollama>=0.10",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
warmintro = "warmintro.cli:main"  # uv run warmintro

[project.optional-dependencies]
# Cloud provider for the deployed app (no PyTorch).
gemini = [
    "llama-index-llms-google-genai>=0.11.3",
    "llama-index-embeddings-google-genai>=0.6",
]
# Granite embeddings on CPU through Hugging Face (installs PyTorch).
hf = ["llama-index-embeddings-huggingface>=0.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warmintro"]

[tool.uv]
# Copy files from uv's cache instead of hardlinking them. NLTK (used by
# llama-index-core) refuses to open hardlinked data files.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import fakes.py
